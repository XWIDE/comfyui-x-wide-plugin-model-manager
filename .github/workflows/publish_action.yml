# 默认：只允许手动发布（手动触发 = 本地测试通过之后再发版）。
# 为什么不用 push 自动发布：这个插件的「禁用/恢复」会改文件系统，
# 必须先在本地真机测过（Windows / macOS / Linux、老前端、批量禁用……）再上架，
# 所以发布是一个**手动步骤**：配好 REGISTRY_ACCESS_TOKEN 后，到
# https://github.com/XWIDE/comfyui-x-wide-plugin-model-manager/actions/workflows/publish_action.yml
# 点 "Run workflow"（分支选 main）即可。
#
# 测试完成后如果想改回「push 到 main 且改了 pyproject.toml 就自动发布」，
# 把下面这段拷回 on: 下面即可（注意缩进与 workflow_dispatch 同级）：
#
#   push:
#     branches:
#       - main
#     paths:
#       - "pyproject.toml"
#
name: Publish to Comfy registry
on:
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
